<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station Alerts | WasteGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/wg-main.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">WG</div>
        <div>
          <div class="sidebar-name">WasteGuard</div>
          <div class="sidebar-tagline">Campus Operations</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="reviews.html" class="nav-item"><span class="nav-icon">🔍</span> Manual Reviews</a>
        <a href="history.html" class="nav-item"><span class="nav-icon">📋</span> Activity History</a>
        <a href="bins.html" class="nav-item"><span class="nav-icon">🏢</span> Station Management</a>
        <div class="nav-divider"></div>
        <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span> Settings</a>
      </nav>
    </aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-title-group">
          <h1>WasteGuard Station Alert Matrix</h1>
          <p>Real-Time Low-Confidence Classification &amp; Bin Threshold Alerts</p>
        </div>
        <div class="header-user-profile">
          <div class="user-info-text">
            <div class="user-name" id="nav-user-name">Loading...</div>
            <div class="user-role" id="nav-user-role">OPERATOR</div>
          </div>
          <div class="user-avatar" id="nav-user-avatar">U</div>
          <button class="btn btn-secondary btn-sm" onclick="AuthManager.logout()">Sign Out</button>
        </div>
      </header>


      <main class="page-content">
        <div class="card" style="margin-bottom:20px; padding:16px;">
          <div style="display:flex; gap:16px; align-items:center;">
            <select id="filter-alert-severity" class="form-control" style="max-width:200px;">
              <option value="">All Severities</option>
              <option value="CRITICAL">CRITICAL Severity</option>
              <option value="HIGH">HIGH Severity</option>
              <option value="WARNING">WARNING</option>
              <option value="INFO">INFO</option>
            </select>

            <select id="filter-alert-status" class="form-control" style="max-width:200px;">
              <option value="NEW">NEW Alerts</option>
              <option value="ACKNOWLEDGED">ACKNOWLEDGED</option>
              <option value="RESOLVED">RESOLVED History</option>
              <option value="">All Statuses</option>
            </select>
          </div>
        </div>

        <div id="alerts-page-list">
          <div class="text-muted" style="padding:24px;">Loading alert matrix...</div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
