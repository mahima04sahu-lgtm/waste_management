<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | WasteGuard Campus Operations</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-main);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 32px;
      box-shadow: var(--shadow-md);
    }
    .demo-role-pills {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-medium);
    }
    .role-pill {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .role-pill:hover {
      background: var(--accent-teal-light);
      border-color: var(--accent-teal);
      transform: translateY(-1px);
    }
    .login-error-banner {
      display: none;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
        <div style="width:36px; height:36px; background:var(--accent-teal); color:#fff; font-weight:800; border-radius:4px; display:flex; align-items:center; justify-content:center;">WG</div>
        <div>
          <h2 style="font-size:18px; font-weight:700;">WasteGuard</h2>
          <p style="font-size:11px; color:var(--text-secondary);">Campus Automated Waste Station Operations Portal</p>
        </div>
      </div>

      <!-- Error notification banner -->
      <div id="login-error-banner" class="login-error-banner"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Employee ID / Username</label>
          <input type="text" id="username" class="form-control" placeholder="e.g. admin or raj_sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group" style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="remember" checked>
          <label for="remember" style="font-size:12px; color:var(--text-secondary); cursor:pointer;">Remember active hospital session</label>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width:100%; padding:10px; font-size:14px; justify-content:center;">
          <span>🔐</span> Authenticate &amp; Sign In
        </button>
      </form>

      <div class="demo-role-pills">
        <div class="role-pill" onclick="quickLogin('admin')">
          <strong>ADMIN</strong><br>Dr. Alok Verma
        </div>
        <div class="role-pill" onclick="quickLogin('supervisor')">
          <strong>SUPERVISOR</strong><br>Sunita Rao
        </div>
        <div class="role-pill" onclick="quickLogin('raj_sharma')">
          <strong>OPERATOR</strong><br>Raj Sharma
        </div>
        <div class="role-pill" onclick="quickLogin('safety_officer')">
          <strong>SAFETY OFFICER</strong><br>Priya Mehta
        </div>
      </div>
      <div style="font-size:11px; text-align:center; color:var(--text-muted); margin-top:8px;">
        💡 Click any demo role pill above for instant 1-click login!
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function quickFill(user) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = 'password123';
      hideError();
    }

    async function quickLogin(user) {
      quickFill(user);
      await performLogin(user, 'password123');
    }

    function showError(msg) {
      const banner = document.getElementById('login-error-banner');
      banner.textContent = msg;
      banner.style.display = 'block';
    }

    function hideError() {
      const banner = document.getElementById('login-error-banner');
      banner.style.display = 'none';
      banner.textContent = '';
    }

    async function performLogin(username, password) {
      hideError();
      const btn = document.getElementById('btn-submit-login');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>⏳</span> Authenticating...';
      btn.disabled = true;

      try {
        await AuthManager.login(username, password);
      } catch (err) {
        console.error('Login error:', err);
        const msg = err.message || 'Invalid credentials or connection error. Please try again.';
        showError(msg);
        if (window.Components && Components.showToast) {
          Components.showToast(msg, 'critical');
        }
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      await performLogin(u, p);
    });
  </script>
</body>
</html>
